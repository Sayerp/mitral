services:
  redis:
    image: redis:7-alpine
    container_name: mitral-redis

  mitral:
    image: 909392367297.dkr.ecr.us-west-2.amazonaws.com/mitral:latest
    container_name: mitral
    depends_on:
      - redis
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      PORT: 8080
    ports:
      - "8080:8080"
