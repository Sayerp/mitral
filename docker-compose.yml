services:
  redis:
    image: redis:7-alpine
    container_name: mitral-redis
    # Temp: exposes Redis to the host so natively-run ./mitral can reach it too. 
    # Remove later to keep Redis off the host network.
    ports:
      - "6379:6379"
  mitral:
    build: .
    container_name: mitral
    depends_on:
      - redis
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      PORT: 8080
    ports:
      - "8080:8080"
